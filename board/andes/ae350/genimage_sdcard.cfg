image boot.vfat {
	vfat {
		files = {
			"u-boot-spl.bin",
			"u-boot.itb",
			"extlinux",
			"Image.gz",
			"dtb",
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = true
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
