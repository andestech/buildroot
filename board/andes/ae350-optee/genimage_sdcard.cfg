image boot.vfat {
	vfat {
		files = {
			"u-boot-spl.bin",
			"u-boot.itb",
			"dtb",
                        "Image.gz",
		}
	}
	size = 8184K
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		image = "boot.vfat"
                offset = 8K
		size = 8184K # 8MB - 8KB
	}

	partition rootfs {
		partition-type = 0x83
		bootable = true
		image = "rootfs.ext4"
		offset = 8M
		size = 24M 
	}
}
